name: ci-cd-pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: ci-test
    runs-on: ubuntu-latest

    steps:
      - name: get files repository
        uses: actions/checkout@v4

      - name: HTML lint
        continue-on-error: true
        run: npx --yes htmlhint index.html

      - name: docker build image
        run: docker build -t ci-cd-lab .

      - name: run container
        run: |
          docker run -d --name test -p 8080:80 ci-cd-lab
          sleep 5

      - name: Smoke test container
        run: |
          curl --fail http://localhost:8080 > page.html
          if grep -q "</h1>" page.html; then
            echo "OK"
          else
            status=$?
            echo "grep exit code: $status"
            exit "$status"
          fi

  release:
    name: release
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: get files repository
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-cd-lab" >> "$GITHUB_ENV"

      - name: log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: docker build image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Build and push
        run: docker push ${{ env.IMAGE_NAME }}:latest